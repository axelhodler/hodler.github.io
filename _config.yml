# Basic
title:              "Axel Hodler"
description:        "Lessons learned around software development, mostly."
author:             "Axel Hodler"

# URL
url:                "https://www.hodler.co"
baseurl:            ""
permalink:          pretty

# Markdown
markdown:           kramdown

# Plugins
plugins:
  - jekyll-feed

# Navigation
nav:
  - name:           "Blog"
    href:           "/"
  - name:           "Books"
    href:           "/books"
  - name:           "About"
    href:           "/about"

# Sass
sass:
  style:            :compressed

collections:
  books:
    output: true

# Not part of the published site
exclude:
  - bin/
  - test/
  - check_availability.sh
  - README.md

# Scopes
defaults:
  -
    scope:
      path:         ""
      type:         "pages"
    values:
      layout:       "page"
  -
    scope:
      path:         ""
      type:         "posts"
    values:
      layout:       "post"
